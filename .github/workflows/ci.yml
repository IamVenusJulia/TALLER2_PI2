name: CI Pipeline

on:
  push:
    branches:
      - main
      - contenerizacion
      - backend/camilo-1
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taller_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: pytest
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taller_db
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: taller_db
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker services
        run: docker compose build
        
  deploy-production:
      name: Deploy Production
      runs-on: ubuntu-latest
      needs:
        - backend-tests
        - frontend-build
        - docker-build
      if: github.ref == 'refs/heads/main'

      permissions:
        contents: read
        packages: write

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Login to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build backend production image
          run: |
            docker build -t ghcr.io/${{ github.repository }}/footcall-backend:${{ github.sha }} ./backend
            docker tag ghcr.io/${{ github.repository }}/footcall-backend:${{ github.sha }} ghcr.io/${{ github.repository }}/footcall-backend:latest

        - name: Push backend image to GHCR
          run: |
            docker push ghcr.io/${{ github.repository }}/footcall-backend:${{ github.sha }}
            docker push ghcr.io/${{ github.repository }}/footcall-backend:latest

        - name: Build frontend production image
          run: |
            docker build -t ghcr.io/${{ github.repository }}/footcall-frontend:${{ github.sha }} ./frontend
            docker tag ghcr.io/${{ github.repository }}/footcall-frontend:${{ github.sha }} ghcr.io/${{ github.repository }}/footcall-frontend:latest

        - name: Push frontend image to GHCR
          run: |
            docker push ghcr.io/${{ github.repository }}/footcall-frontend:${{ github.sha }}
            docker push ghcr.io/${{ github.repository }}/footcall-frontend:latest

        - name: Trigger Render backend deployment
          run: curl -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK_URL }}"

        - name: Deploy frontend to Vercel
          working-directory: frontend
          run: |
            npm install -g vercel
            vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
            vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          env:
            VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
            VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

        - name: Deployment status
          run: |
            echo "Production deployment completed."
            echo "Backend redeploy triggered in Render."
            echo "Frontend deployed to Vercel."