services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taller_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@database:5432/taller_db
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=taller_db
      - GOOGLE_API_KEY=AIzaSyDnUQQnpzyiXaYbEW1W1QVRKDkT_0sX8hQ
    depends_on:
      - database

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taller_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
    - NEXT_PUBLIC_API_URL=http://localhost:8000
    - NEXT_PUBLIC_SUPABASE_URL=https://jieduufpryoypaasafpg.supabase.co/rest/v1/
    - NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_-gMMScRqiiFvsvPuNn608w_mM7zQnEd
    depends_on:
      - backend

  database:
    image: postgres:16-alpine
    container_name: taller_database
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=taller_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: